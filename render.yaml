services:
  - type: web
    name: fullstack-ecommerce-backend
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: FRONTEND_URL
        value: https://fullstack-ecommerce-seven-lovat.vercel.app
      - key: FRONTEND_DOMAIN
        value: fullstack-ecommerce-seven-lovat.vercel.app
      - key: PROTOCOL
        value: https
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://fullstack-ecommerce-seven-lovat.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://fullstack-ecommerce-seven-lovat.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_CURRENCY
        value: pkr
      - key: STRIPE_AMOUNT_MULTIPLIER
        value: "100"
      - key: SHIPPING_PRICE
        value: "150.00"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
